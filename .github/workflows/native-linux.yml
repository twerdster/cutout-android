name: Native Linux

on:
  push:
    paths:
      - '.github/workflows/native-linux.yml'
      - 'updated/native/**'
      - 'updated/validation/**'
      - 'source/ANDROID_PROVENANCE.json'
      - 'source/PROVENANCE.json'
      - 'source/original/**'
  pull_request:
    paths:
      - '.github/workflows/native-linux.yml'
      - 'updated/native/**'
      - 'updated/validation/**'
      - 'source/ANDROID_PROVENANCE.json'
      - 'source/PROVENANCE.json'
      - 'source/original/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 libclang-rt-18-dev cmake ninja-build libopencv-dev pkg-config python3 python3-pil
      - name: Build and check native operators
        run: |
          mkdir -p build/linux-validation
          cmake -S updated/native -B build/linux-native -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCUTOUT_SANITIZE=ON
          cmake --build build/linux-native --parallel 2
          ctest --test-dir build/linux-native --verbose --output-on-failure --no-tests=error \
            | tee build/linux-validation/native-ctest.log
          cp build/linux-native/CMakeCache.txt build/linux-validation/native-CMakeCache.txt
      - name: Check unsigned plain char
        run: |
          cmake -S updated/native -B build/linux-native-unsigned -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCUTOUT_SANITIZE=ON \
            -DCMAKE_CXX_FLAGS=-funsigned-char
          cmake --build build/linux-native-unsigned --parallel 2
          ctest --test-dir build/linux-native-unsigned --verbose --output-on-failure --no-tests=error \
            | tee build/linux-validation/unsigned-char-ctest.log
          cp build/linux-native-unsigned/CMakeCache.txt build/linux-validation/unsigned-char-CMakeCache.txt
      - name: Check CLI image I/O and errors
        run: |
          python3 updated/validation/check_cli.py \
            --binary build/linux-native/cutout_cli \
            --output-dir build/linux-validation/cli
      - name: Compare original and updated function bodies
        run: |
          python3 updated/validation/verify_original_failures.py \
            --compiler clang++-18 \
            --updated-regressions build/linux-native/cutout_regressions \
            --report build/linux-validation/original-comparisons.json
      - name: Record results and source hashes
        run: |
          python3 updated/native/scripts/record_validation.py \
            --native-cache build/linux-validation/native-CMakeCache.txt \
            --unsigned-cache build/linux-validation/unsigned-char-CMakeCache.txt \
            --native-log build/linux-validation/native-ctest.log \
            --unsigned-log build/linux-validation/unsigned-char-ctest.log \
            --cli-report build/linux-validation/cli/cli-validation.json \
            --original-report build/linux-validation/original-comparisons.json \
            --output build/linux-validation/validation.json
      - name: Keep validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-validation
          path: build/linux-validation/
          if-no-files-found: warn
          retention-days: 14
